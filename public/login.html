<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MatchDistrict Outreach — Admin Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo-wrap">
      <svg class="whatsapp-official-logo" viewBox="0 0 24 24" width="40" height="40" fill="#25D366" aria-label="WhatsApp">
        <path d="M12.004 2C6.48 2 2.004 6.476 2.004 12c0 1.86.51 3.6 1.396 5.102L2.05 22l5.067-1.328A9.957 9.957 0 0 0 12.004 22c5.523 0 10-4.476 10-10 0-5.524-4.477-10-10-10zm5.666 14.175c-.242.68-1.22 1.258-1.745 1.332-.464.065-1.07.094-1.72-.113-.393-.126-.897-.291-1.547-.573-2.732-1.183-4.516-3.939-4.653-4.122-.137-.183-1.109-1.474-1.109-2.812 0-1.338.705-1.996.955-2.268.25-.272.545-.34.726-.34.181 0 .363.002.521.01.168.008.392-.064.614.467.227.545.772 1.884.84 2.02.068.136.113.295.023.476-.09.182-.136.295-.272.454-.136.16-.286.357-.409.479-.136.136-.278.284-.12.556.159.272.705 1.164 1.512 1.884 1.041.928 1.918 1.214 2.19 1.35.272.136.431.114.59-.068.16-.182.68-.795.862-1.067.182-.272.363-.227.613-.136.25.09 1.59.75 1.862.886.273.136.454.204.522.318.068.113.068.658-.174 1.338z"/>
      </svg>
    </div>
    <h2>MatchDistrict Outreach</h2>
    <p>Sign in to orchestrate WhatsApp campaigns and auto-replies.</p>

    <div id="alertBox" class="alert alert-danger" style="display: none;"></div>

    <form id="loginForm" method="POST" action="/login">
      <div class="form-group" style="text-align: left;">
        <label for="password" class="form-label">Admin Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In to Console</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alertBox');
    if (params.get('error') === 'invalid' && alertBox) {
      alertBox.textContent = 'Invalid administrator password. Please try again.';
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
